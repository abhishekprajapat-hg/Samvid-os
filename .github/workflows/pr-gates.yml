name: PR And Main Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: pr-main-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint Coverage Integration Audit
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/samvid_os_ci_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Confirm Mongo test database safety
        run: |
          node -e "const uri=process.env.MONGO_TEST_URI||''; if(!/127\\.0\\.0\\.1|localhost/.test(uri) || !/test|ci|integration|e2e/.test(uri)) { throw new Error('Unsafe MONGO_TEST_URI for CI'); } console.log('Using isolated Mongo test URI');"
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - name: Production dependency audit policy
        run: |
          mkdir -p ../artifacts
          npm audit --omit=dev --json > ../artifacts/backend-audit.json || true
          node ../.github/scripts/audit-policy.cjs backend ../artifacts/backend-audit.json ../.github/audit-policy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-artifacts
          path: |
            backend/coverage
            artifacts/backend-audit.json

  frontend:
    name: Frontend Lint Coverage Build Browser Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      PLAYWRIGHT_UPDATE_SNAPSHOTS: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:smoke
      - name: Production dependency audit policy
        run: |
          mkdir -p ../artifacts
          npm audit --omit=dev --json > ../artifacts/frontend-audit.json || true
          node ../.github/scripts/audit-policy.cjs frontend ../artifacts/frontend-audit.json ../.github/audit-policy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-artifacts
          path: |
            frontend/coverage
            frontend/playwright-report
            frontend/test-results
            artifacts/frontend-audit.json

  mobile:
    name: Mobile Unit Coverage Typecheck Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npx tsc --noEmit
      - name: Production dependency audit policy
        run: |
          mkdir -p ../artifacts
          npm audit --omit=dev --json > ../artifacts/mobile-audit.json || true
          node ../.github/scripts/audit-policy.cjs mobile ../artifacts/mobile-audit.json ../.github/audit-policy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-artifacts
          path: |
            mobile/coverage
            artifacts/mobile-audit.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
