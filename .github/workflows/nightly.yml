name: Nightly Regression

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  full-regression:
    name: API Browser Mobile Regression
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/samvid_os_nightly_test
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts
          path: |
            backend/coverage
            frontend/coverage
            frontend/playwright-report
            frontend/test-results
            mobile/coverage

  moderate-load:
    name: Moderate k6 Load
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: performance/k6/core-business.js
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          LOAD_PROFILE: normal
