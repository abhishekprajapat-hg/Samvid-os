name: Nightly Regression

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  full-regression:
    name: Full API Browser Mobile Regression
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/samvid_os_nightly_test
      PLAYWRIGHT_UPDATE_SNAPSHOTS: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts
          path: |
            backend/coverage
            frontend/coverage
            frontend/playwright-report
            frontend/test-results
            mobile/coverage

  authenticated-load:
    name: Authenticated k6 Normal Load
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run authenticated normal load when staging auth is configured
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
          CONFIRM_ISOLATED_PERF_ENV: "true"
          PERF_ENVIRONMENT: staging
          PERF_RUN_ID: nightly-${{ github.run_id }}
          LOAD_PROFILE: normal
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Authenticated k6 skipped: STAGING_ACCESS_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          k6 run performance/k6/core-business.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-performance-artifacts
          path: performance

  mobile-device-e2e-not-executed:
    name: Mobile Device E2E Status
    runs-on: ubuntu-latest
    if: ${{ vars.MOBILE_E2E_RUNNER_ENABLED != 'true' }}
    steps:
      - run: |
          echo "Mobile Maestro device E2E was not executed because MOBILE_E2E_RUNNER_ENABLED is not true." >> "$GITHUB_STEP_SUMMARY"
          echo "Use a dedicated self-hosted runner labelled mobile-e2e with Android/iOS devices." >> "$GITHUB_STEP_SUMMARY"

  mobile-device-e2e:
    name: Mobile Device E2E
    runs-on: [self-hosted, mobile-e2e]
    if: ${{ vars.MOBILE_E2E_RUNNER_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:android
      - run: npm run test:e2e:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-device-e2e-artifacts
          path: mobile/e2e
