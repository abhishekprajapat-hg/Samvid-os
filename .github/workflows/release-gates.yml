name: Release Gates

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Isolated staging URL for smoke and performance checks
        required: true
        type: string
      staging_environment:
        description: Staging marker used by fail-closed performance tests
        required: true
        default: staging
        type: choice
        options:
          - staging
          - performance
          - isolated
          - local-isolated
      run_mobile_device_e2e:
        description: Run Maestro on a dedicated self-hosted mobile-e2e runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  regression:
    name: Reusable PR/Main Gates
    uses: ./.github/workflows/pr-gates.yml

  performance:
    name: Authenticated Performance Thresholds
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run authenticated k6 normal load
        env:
          BASE_URL: ${{ inputs.staging_url }}
          ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
          CONFIRM_ISOLATED_PERF_ENV: "true"
          PERF_ENVIRONMENT: ${{ inputs.staging_environment }}
          PERF_RUN_ID: release-${{ github.run_id }}
          LOAD_PROFILE: normal
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "STAGING_ACCESS_TOKEN secret is required for release performance gates." >&2
            exit 1
          fi
          k6 run performance/k6/core-business.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-performance-artifacts
          path: performance

  release-smoke:
    name: Deployment Smoke
    runs-on: ubuntu-latest
    needs: performance
    steps:
      - name: Smoke isolated staging health
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          curl --fail --show-error --silent "$STAGING_URL/api/health"
          curl --fail --show-error --silent "$STAGING_URL/api/client/health"

  mobile-device-e2e-not-executed:
    name: Mobile Device E2E Status
    runs-on: ubuntu-latest
    needs: regression
    if: ${{ !inputs.run_mobile_device_e2e }}
    steps:
      - run: |
          echo "Mobile Maestro device E2E was not executed for this release gate dispatch." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-dispatch with run_mobile_device_e2e=true on a self-hosted runner labelled mobile-e2e when devices are available." >> "$GITHUB_STEP_SUMMARY"

  mobile-device-e2e:
    name: Mobile Device E2E
    runs-on: [self-hosted, mobile-e2e]
    needs: regression
    if: ${{ inputs.run_mobile_device_e2e }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:android
      - run: npm run test:e2e:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-mobile-device-e2e-artifacts
          path: mobile/e2e
