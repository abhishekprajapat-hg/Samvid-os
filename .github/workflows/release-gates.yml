name: Release Gates

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Isolated staging URL for smoke and performance checks
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  regression:
    uses: ./.github/workflows/pr-gates.yml

  performance:
    name: Performance Thresholds
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: performance/k6/core-business.js
        env:
          BASE_URL: ${{ inputs.staging_url }}
          LOAD_PROFILE: normal

  release-smoke:
    name: Deployment Smoke
    runs-on: ubuntu-latest
    needs: performance
    steps:
      - run: curl --fail --show-error "${{ inputs.staging_url }}/api/health"
