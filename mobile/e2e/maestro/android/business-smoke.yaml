appId: com.samvidos.crm
name: Android Business Navigation Smoke
---
- launchApp:
    clearState: true
- assertVisible: "ADMIN LOGIN"
- tapOn:
    id: "login-email"
- inputText: "${SAMVID_MOBILE_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${SAMVID_MOBILE_PASSWORD}"
- tapOn:
    id: "login-submit"
- assertVisible: "Logout"
- tapOn: "More"
- assertVisible: "Samvid Assistant"
- assertVisible: "Profile"
- assertVisible: "Tasks"
- tapOn:
    id: "more-menu-tasks"
- assertVisible: "Tasks"
- back
- assertVisible: "More"
- tapOn:
    id: "more-menu-attendance"
- assertVisible: "Attendance"
- back
- assertVisible: "More"
- tapOn:
    id: "more-menu-profile"
- assertVisible: "Profile"
- back
- assertVisible: "More"
